  <style>
    *,

      margin: 0;
      box-sizing: border-box;
    }

    #header {
      background: url(./images/main_header.png) no-repeat;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      z-index: 999;
    }

    }

    #sideber {

      overflow: auto;
      position: fixed;
      left: 0;
      top: 60px;
      background: url(./images/sidebar.png) no-repeat;
      /* color: white; */
    }

    #main-header {
      width: calc(100% - 270px);
      height: 54px;
      background: url(./images/two_header.png) no-repeat;
      position: absolute;
      top: 58px;
      left: 253px;
      z-index: 999;
    }

    .container {
      position: relative;
      width: calc(100vw - 270px);
      top: 54px;
      left: 253px;
      flex-wrap: wrap;
    }

    .card {
      /* position: absolute; */
      width: calc(100% / 3.0008);
      float: left;

      display: block;
    }

    .card iframe {
      border-radius: 10px;
    }
  </style>

</head>
